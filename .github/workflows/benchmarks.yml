name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Atomix Go 1.27.x
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-compiler check-compiler COMPILER_DIR="$RUNNER_TEMP/go-atomix"

      - name: Run queue benchmarks
        id: bench
        shell: bash
        run: |
          results="$RUNNER_TEMP/lfq-benchmarks"
          mkdir -p "$results"
          {
            uname -srm
            "$RUNNER_TEMP/go-atomix/bin/go" version
            timeout -k 5s 2m make bench-ci COMPILER_DIR="$RUNNER_TEMP/go-atomix"
          } 2>&1 | tee "$results/benchmarks.txt"

      - name: Publish benchmark summary
        if: ${{ !cancelled() && steps.bench.outcome != 'skipped' }}
        shell: bash
        run: |
          results="$RUNNER_TEMP/lfq-benchmarks"
          compiler="$RUNNER_TEMP/go-atomix"
          GOTOOLCHAIN=local GOROOT="$compiler" "$compiler/bin/go" run .github/benchmark-summary.go \
            < "$results/benchmarks.txt" | tee "$results/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: ${{ !cancelled() && steps.bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: lfq-benchmarks-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/lfq-benchmarks/
          if-no-files-found: error
